<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="cbg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060a12"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="cglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#cbg)"/>
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#06b6d4" stroke-opacity="0.28" stroke-width="4"/>

  <!-- Subtle Canvas Grid -->
  <g stroke="#1e293b" stroke-width="2" opacity="0.6">
    <line x1="128" y1="64" x2="128" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="384" y1="64" x2="384" y2="448"/>
    <line x1="64" y1="128" x2="448" y2="128"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="384" x2="448" y2="384"/>
  </g>

  <!-- Bezier String Connections -->
  <path d="M 256 175 C 256 235, 145 240, 145 305" fill="none" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round" filter="url(#cglow)"/>
  <path d="M 256 175 C 256 235, 367 240, 367 305" fill="none" stroke="url(#roseGrad)" stroke-width="8" stroke-dasharray="14 10" stroke-linecap="round" filter="url(#cglow)"/>
  <path d="M 195 345 C 245 375, 267 375, 317 345" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Root Node (Top Center) -->
  <rect x="176" y="96" width="160" height="82" rx="22" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="8" filter="url(#cglow)"/>
  <line x1="204" y1="128" x2="308" y2="128" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>
  <line x1="204" y1="150" x2="276" y2="150" stroke="#67e8f9" stroke-width="6" stroke-linecap="round"/>

  <!-- Left Node (Cyan/Emerald) -->
  <rect x="76" y="302" width="138" height="96" rx="20" fill="#0f172a" stroke="url(#emeraldGrad)" stroke-width="7" filter="url(#cglow)"/>
  <line x1="100" y1="336" x2="186" y2="336" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
  <line x1="100" y1="360" x2="164" y2="360" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round"/>

  <!-- Right Node (Rose) -->
  <rect x="298" y="302" width="138" height="96" rx="20" fill="#0f172a" stroke="url(#roseGrad)" stroke-width="7" filter="url(#cglow)"/>
  <line x1="322" y1="336" x2="408" y2="336" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
  <line x1="322" y1="360" x2="386" y2="360" stroke="#fda4af" stroke-width="5" stroke-linecap="round"/>

  <!-- Port Dots -->
  <circle cx="256" cy="178" r="9" fill="#67e8f9"/>
  <circle cx="145" cy="302" r="9" fill="#6ee7b7"/>
  <circle cx="367" cy="302" r="9" fill="#fda4af"/>
</svg>
