<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="ebg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="eglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#ebg)"/>
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#ffd700" stroke-opacity="0.3" stroke-width="4"/>
  <!-- Roulette wheel outer rim -->
  <circle cx="256" cy="270" r="170" fill="#09090b" stroke="url(#goldGrad)" stroke-width="12" filter="url(#eglow)"/>
  <!-- Slices -->
  <path d="M 256 270 L 256 110 A 160 160 0 0 1 369 157 Z" fill="#991b1b"/>
  <path d="M 256 270 L 369 157 A 160 160 0 0 1 416 270 Z" fill="#18181b"/>
  <path d="M 256 270 L 416 270 A 160 160 0 0 1 369 383 Z" fill="#991b1b"/>
  <path d="M 256 270 L 369 383 A 160 160 0 0 1 256 430 Z" fill="#18181b"/>
  <path d="M 256 270 L 256 430 A 160 160 0 0 1 143 383 Z" fill="#991b1b"/>
  <path d="M 256 270 L 143 383 A 160 160 0 0 1 96 270 Z" fill="#18181b"/>
  <path d="M 256 270 L 96 270 A 160 160 0 0 1 143 157 Z" fill="#15803d"/>
  <path d="M 256 270 L 143 157 A 160 160 0 0 1 256 110 Z" fill="#18181b"/>
  <!-- Center hub -->
  <circle cx="256" cy="270" r="50" fill="url(#goldGrad)" filter="url(#eglow)"/>
  <circle cx="256" cy="270" r="26" fill="#09090b"/>
  <!-- Pointer pin -->
  <polygon points="256,125 240,85 272,85" fill="url(#goldGrad)" filter="url(#eglow)"/>
