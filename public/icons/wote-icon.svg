<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181d14"/>
      <stop offset="100%" stop-color="#0d110a"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#2f3b28" stroke-width="12"/>

  <!-- Subtle Inner Grid / Nodes Background -->
  <g opacity="0.12" stroke="#22d3ee" stroke-width="2">
    <circle cx="160" cy="180" r="6" fill="#22d3ee"/>
    <circle cx="256" cy="120" r="6" fill="#22d3ee"/>
    <circle cx="352" cy="180" r="6" fill="#22d3ee"/>
    <line x1="160" y1="180" x2="256" y2="120"/>
    <line x1="256" y1="120" x2="352" y2="180"/>
  </g>

  <!-- Central Stylized 'W' Outliner Tree Icon with Glow -->
  <g filter="url(#glow)">
    <!-- Tree connection lines -->
    <path d="M 120 160 L 195 360 L 256 220 L 317 360 L 392 160" 
          fill="none" 
          stroke="url(#neonCyan)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Nodes at key vertices -->
    <circle cx="120" cy="160" r="18" fill="#38bdf8" />
    <circle cx="195" cy="360" r="18" fill="#22d3ee" />
    <circle cx="256" cy="220" r="22" fill="#ffffff" stroke="#22d3ee" stroke-width="6"/>
    <circle cx="317" cy="360" r="18" fill="#22d3ee" />
    <circle cx="392" cy="160" r="18" fill="#34d399" />
  </g>
</svg>
